<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: #0f1220;
  color: #eaeaf0;
  padding: 20px;
}
.container { max-width: 1200px; margin: auto; }
.card {
  background: #171a2e;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
textarea {
  width: 100%;
  min-height: 120px;
  background: #0f1220;
  color: #eaeaf0;
  border: 1px solid #2a2f55;
  border-radius: 6px;
  padding: 10px;
}
button {
  background: #4f7cff;
  border: none;
  color: #fff;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border-bottom: 1px solid #2a2f55;
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}
th { color: #9aa4ff; text-align: left; }
</style>
</head>

<body>
<div class="container">

<h1>Bulk Domain Detector</h1>

<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <label style="display:flex;align-items:center;gap:8px;font-size:13px">
    <input type="checkbox" id="dnsOnlyToggle" checked>
    Attempt cPanel detection only if DNS-only
  </label>
  <br>
  <button id="run">Run Detection</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>IP</th>
        <th>Registrar</th>
        <th>Cloudflare</th>
        <th>CF Proxy</th>
        <th>cPanel</th>
        <th>Nameservers</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
document.getElementById("run").onclick = async () => {
  const domains = document.getElementById("domains")
    .value.split(/\s+/).filter(Boolean);

  const tbody = document.getElementById("results");
  tbody.innerHTML = "<tr><td colspan='7'>Checking…</td></tr>";

  const res = await fetch("/.netlify/functions/detect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ domains })
  });

  const data = await res.json();
  tbody.innerHTML = "";

  const dnsOnlyMode = document.getElementById("dnsOnlyToggle").checked;

  for (const r of data) {
    const cpanelDisplay =
      dnsOnlyMode && r.cf_proxy === "Proxied"
        ? "Skipped (Cloudflare)"
        : r.cpanel || "-";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.domain}</td>
      <td>${r.ip || "-"}</td>
      <td>${r.registrar || "-"}</td>

      <td>
        ${
          r.cloudflare_email && r.cloudflare_email !== "-"
            ? `<div style="font-size:14px;font-weight:600;color:#7dffb3">
                 ${r.cloudflare_email}
               </div>`
            : `<span style="opacity:.5">-</span>`
        }
      </td>

      <td>${r.cf_proxy}</td>
      <td>${cpanelDisplay}</td>
      <td>${r.nameservers || "-"}</td>
    `;
    tbody.appendChild(tr);
  }
};
</script>

</body>
</html>
