<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: #0f1220;
  color: #eaeaf0;
  padding: 20px;
}
.container { max-width: 1200px; margin: auto; }
.card {
  background: #171a2e;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
textarea {
  width: 100%;
  min-height: 120px;
  background: #0f1220;
  color: #eaeaf0;
  border: 1px solid #2a2f55;
  border-radius: 6px;
  padding: 10px;
}
button {
  background: #4f7cff;
  border: none;
  color: #fff;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border-bottom: 1px solid #2a2f55;
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}
th { color: #9aa4ff; text-align: left; }
</style>
</head>

<body>
<div class="container">

<h1>Bulk Domain Detector</h1>

<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>


<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Registrar</th>
        <th>Cloudflare</th>
        <th>Nameservers</th>
      </tr>
    </thead>

    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
/* ---------- DOMAIN NORMALIZER (FRONTEND) ---------- */
function normalizeDomain(input) {
  try {
    input = input.trim();
    if (!input.startsWith("http")) input = "http://" + input;
    const url = new URL(input);
    return url.hostname.replace(/^www\./, "");
  } catch {
    return input.split("/")[0].replace(/^www\./, "");
  }
}

document.getElementById("run").onclick = async () => {
  const rawLines = document.getElementById("domains")
    .value.split(/\s+/)
    .filter(Boolean);

  const domains = [...new Set(
    rawLines.map(d => normalizeDomain(d)).filter(Boolean)
  )];

  const tbody = document.getElementById("results");
  tbody.innerHTML = "<tr><td colspan='4'>Checking…</td></tr>";

  const res = await fetch("/.netlify/functions/detect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ domains })
  });

  const data = await res.json();
  tbody.innerHTML = "";

  for (const r of data) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.domain}</td>
      <td>${r.registrar || "-"}</td>
      <td>
        ${
          r.cloudflare && r.cloudflare !== "-"
            ? `<div style="font-size:14px;font-weight:600;color:#7dffb3">
                 ${r.cloudflare}
               </div>`
            : `<span style="opacity:.5">-</span>`
        }
      </td>
      <td>${r.nameservers || "-"}</td>
    `;
    tbody.appendChild(tr);
  }
};
</script>


</body>
</html>
