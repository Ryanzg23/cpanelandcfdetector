<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
}

body.dark {
  --bg: #0f1220;
  --card: #171a2e;
  --text: #eaeaf0;
  --muted: #9ca3af;
  --border: #2a2f55;
  --accent: #4f7cff;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  transition: background .2s, color .2s;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.theme-btn:hover {
  background: var(--border);
}
.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--card);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}

textarea {
  width: 100%;
  min-height: 120px;
  box-sizing: border-box;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  resize: vertical;
}


button {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border-bottom: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}

th {
  color: var(--muted);
  text-align: left;
}

.theme-toggle {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.theme-toggle input {
  width: 40px;
  height: 20px;
}
/* Zebra striping for table rows */
tbody tr:nth-child(even) {
  background: rgba(0,0,0,.03);
}
body.dark tbody tr:nth-child(even) {
  background: rgba(255,255,255,.04);
}

/* Optional: subtle hover highlight */
tbody tr:hover {
  background-color: rgba(37, 99, 235, 0.08);
}

</style>

</head>

<body>
<div class="container">

<div class="header">
  <h1>Bulk Domain Detector</h1>
  <button id="themeToggle" class="theme-btn">🌙 Dark</button>
</div>


<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>


<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Cloudflare</th>
        <th>Registrar</th>
        <th>HTTP Result</th>
        <th>301 Via</th>
        <th></th>
        <th>Nameservers</th>
      </tr>
    </thead>

    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
/* ---------- THEME TOGGLE ---------- */
const btn = document.getElementById("themeToggle");

function setTheme(t) {
  document.body.classList.toggle("dark", t === "dark");
  btn.textContent = t === "dark" ? "🌞 Light" : "🌙 Dark";
  localStorage.setItem("theme", t);
}

setTheme(localStorage.getItem("theme") || "light");

btn.onclick = () => {
  setTheme(document.body.classList.contains("dark") ? "light" : "dark");
};

/* ---------- DOMAIN NORMALIZER ---------- */
function normalizeDomain(input) {
  try {
    if (!input.startsWith("http")) input = "http://" + input;
    return new URL(input).hostname.replace(/^www\./, "");
  } catch {
    return input.split("/")[0].replace(/^www\./, "");
  }
}

document.getElementById("run").onclick = async () => {
  const domains = [...new Set(
    document.getElementById("domains").value
      .split(/\s+/)
      .map(normalizeDomain)
      .filter(Boolean)
  )];

  const tbody = document.getElementById("results");
  tbody.innerHTML = "";

  const res = await fetch("/.netlify/functions/detect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ domains })
  });

  const data = await res.json();

  for (const r of data) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.domain}</td>
      <td>${r.cloudflare || "-"}</td>
      <td>${r.registrar || "-"}</td>
      <td title="Redirect detected. Full 301 trail available.">
        ${r.http_result}
      </td>
      <td>${r.http_via || "-"}</td>
      <td>${r.nameservers || "-"}</td>
    `;
    tbody.appendChild(tr);
  }
};
</script>

</body>
</html>
