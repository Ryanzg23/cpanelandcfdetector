<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
}

body.dark {
  --bg: #0f1220;
  --card: #171a2e;
  --text: #eaeaf0;
  --muted: #9ca3af;
  --border: #2a2f55;
  --accent: #4f7cff;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  transition: background .2s, color .2s;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.theme-btn:hover {
  background: var(--border);
}
.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--card);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}

textarea {
  width: 100%;
  min-height: 120px;
  box-sizing: border-box;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  resize: vertical;
}


button {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
button#run {
  transition: background-color .2s, transform .1s, box-shadow .2s;
}

button#run:hover {
  background-color: #1d4ed8; /* slightly darker accent */
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  transform: translateY(-1px);
}

button#run:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
}


table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border-bottom: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}

th {
  color: var(--muted);
  text-align: left;
}

.theme-toggle {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.theme-toggle input {
  width: 40px;
  height: 20px;
}
/* Zebra striping for table rows */
tbody tr:nth-child(even) {
  background: rgba(0,0,0,.03);
}
body.dark tbody tr:nth-child(even) {
  background: rgba(255,255,255,.04);
}

/* Optional: subtle hover highlight */
tbody tr:hover {
  background-color: rgba(37, 99, 235, 0.08);
}


.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 999;
}

.modal-content {
  background: var(--card);
  color: var(--text);
  max-width: 640px;
  margin: 8vh auto;
  border-radius: 10px;
  overflow: hidden;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.modal-body {
  padding: 16px;
  font-size: 13px;
  line-height: 1.6;
}

.modal-header button {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--text);
}
td {
  vertical-align: middle;
}
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #111827;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s, transform .3s;
  transform: translateY(10px);
  z-index: 1000;
}

body.dark .toast {
  background: #e5e7eb;
  color: #111827;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.action-link {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
}

.action-link:hover {
  text-decoration: underline;
}

.action-link.copied {
  color: #16a34a; /* green */
  font-weight: 600;
  cursor: default;
  text-decoration: none;
}


.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}
</style>

</head>

<body>
<div class="container">

<div class="header">
  <h1>Bulk Domain Detector</h1>
  <button id="themeToggle" class="theme-btn">🌙 Dark</button>
</div>


<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>


<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Cloudflare</th>
        <th>HTTP Result</th>
        <th>301 Via</th>
        <th>Registrar</th>
        <th>Nameservers</th>
      </tr>
    </thead>
  <tbody id="results"></tbody>

  </table>
</div>

</div>


<div id="trailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <strong>Redirect Trail</strong>
      <button onclick="closeTrail()">✕</button>
    </div>
    <div id="trailBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast">Copied</div>
<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ================= GLOBAL STATE ================= */
  let isRunning = false;
  window.TRAILS = {}; // must be global for modal

  /* ================= THEME TOGGLE ================= */
  const themeBtn = document.getElementById("themeToggle");
  if (themeBtn) {
    function setTheme(theme) {
      document.body.classList.toggle("dark", theme === "dark");
      themeBtn.textContent = theme === "dark" ? "🌞 Light" : "🌙 Dark";
      localStorage.setItem("theme", theme);
    }

    setTheme(localStorage.getItem("theme") || "light");

    themeBtn.addEventListener("click", () => {
      setTheme(document.body.classList.contains("dark") ? "light" : "dark");
    });
  }

  /* ================= MODAL ================= */
  window.openTrail = function (id) {
    const trail = window.TRAILS[id];
    if (!trail || !trail.length) return;

    const body = document.getElementById("trailBody");
    body.innerHTML = trail.map(t =>
      `${t.url}
       <span style="opacity:.6">
         (${t.status}${t.status >= 300 && t.status < 400 ? ", via " + t.via : ""})
       </span>`
    ).join("<br>");

    document.getElementById("trailModal").style.display = "block";
  };

  window.closeTrail = function () {
    document.getElementById("trailModal").style.display = "none";
  };

  /* ================= COPY (ChatGPT STYLE) ================= */
  window.copyNameservers = function (el, domain, nameservers, registrar) {
    if (!nameservers) return;

    const text =
      domain + "\n" +
      nameservers.split(",").map(ns => ns.trim()).join("\n") +
      "\nRegistrar: " + (registrar || "-");

    navigator.clipboard.writeText(text).then(() => {
      const original = el.textContent;
      el.textContent = "Copied";
      el.classList.add("copied");
      el.style.pointerEvents = "none";

      setTimeout(() => {
        el.textContent = original;
        el.classList.remove("copied");
        el.style.pointerEvents = "auto";
      }, 2000);
    });
  };

  /* ================= RUN DETECTION ================= */
  const runBtn = document.getElementById("run");
  const textarea = document.getElementById("domains");
  const tbody = document.getElementById("results");

  if (!runBtn || !textarea || !tbody) {
    console.error("Required elements missing");
    return;
  }

  runBtn.addEventListener("click", async () => {
    if (isRunning) return;
    isRunning = true;

    runBtn.disabled = true;
    runBtn.textContent = "Checking…";

    const domains = [...new Set(
      textarea.value
        .split(/\s+/)
        .map(d => d.trim())
        .filter(Boolean)
    )];

    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="opacity:.6">Checking…</td>
      </tr>
    `;

    try {
      const res = await fetch("/.netlify/functions/detect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domains })
      });

      const data = await res.json();
      tbody.innerHTML = "";
      window.TRAILS = {};

      data.forEach((r, i) => {
        const id = "trail_" + i;
        window.TRAILS[id] = r.http_trail || [];

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.domain}</td>

          <td>${r.cloudflare || "-"}</td>

          <td>
            ${r.http_result || "-"}
            ${
              r.http_trail && r.http_trail.length > 1
                ? ` <a class="action-link"
                     onclick="openTrail('${id}')">(view trail)</a>`
                : ""
            }
          </td>

          <td>${r.http_via || "-"}</td>

          <td>${r.registrar || "-"}</td>

          <td style="position:relative">
            ${
              r.nameservers && r.nameservers !== "-"
                ? `
                  <div style="position:absolute;top:6px;right:8px">
                    <a class="action-link"
                       onclick="copyNameservers(
                         this,
                         '${r.domain}',
                         '${r.nameservers}',
                         '${r.registrar || "-"}'
                       )">
                      Copy
                    </a>
                  </div>

                  <div style="padding-top:16px">
                    ${r.nameservers.split(",").map(ns => `
                      <div class="mono">${ns.trim()}</div>
                    `).join("")}
                  </div>
                `
                : "-"
            }
          </td>
        `;
        tbody.appendChild(tr);
      });

    } catch (err) {
      console.error(err);
      tbody.innerHTML = `
        <tr>
          <td colspan="6" style="color:#dc2626">
            Detection failed. Please try again.
          </td>
        </tr>
      `;
    }

    runBtn.disabled = false;
    runBtn.textContent = "Run Detection";
    isRunning = false;
  });
});
</script>

</body>
</html>
