<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
}

body.dark {
  --bg: #0f1220;
  --card: #171a2e;
  --text: #eaeaf0;
  --muted: #9ca3af;
  --border: #2a2f55;
  --accent: #4f7cff;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  transition: background .2s, color .2s;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.theme-btn:hover {
  background: var(--border);
}
.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--card);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}

textarea {
  width: 100%;
  min-height: 120px;
  box-sizing: border-box;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  resize: vertical;
}


button {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
button#run {
  transition: background-color .2s, transform .1s, box-shadow .2s;
}

button#run:hover {
  background-color: #1d4ed8; /* slightly darker accent */
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  transform: translateY(-1px);
}

button#run:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
}


table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border-bottom: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}

th {
  color: var(--muted);
  text-align: left;
}

.theme-toggle {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.theme-toggle input {
  width: 40px;
  height: 20px;
}
/* Zebra striping for table rows */
tbody tr:nth-child(even) {
  background: rgba(0,0,0,.03);
}
body.dark tbody tr:nth-child(even) {
  background: rgba(255,255,255,.04);
}

/* Optional: subtle hover highlight */
tbody tr:hover {
  background-color: rgba(37, 99, 235, 0.08);
}

</style>

</head>

<body>
<div class="container">

<div class="header">
  <h1>Bulk Domain Detector</h1>
  <button id="themeToggle" class="theme-btn">🌙 Dark</button>
</div>


<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>


<div class="card">
  <table>
   <thead>
    <tr>
      <th>Domain</th>
      <th>Cloudflare</th>
      <th>Registrar</th>
      <th>HTTP Result</th>
      <th>301 Via</th>
      <th>Nameservers</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>

  </table>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ---------- THEME TOGGLE ---------- */
  const themeBtn = document.getElementById("themeToggle");
  if (themeBtn) {
    const setTheme = (t) => {
      document.body.classList.toggle("dark", t === "dark");
      themeBtn.textContent = t === "dark" ? "🌞 Light" : "🌙 Dark";
      localStorage.setItem("theme", t);
    };

    setTheme(localStorage.getItem("theme") || "light");

    themeBtn.onclick = () => {
      setTheme(
        document.body.classList.contains("dark") ? "light" : "dark"
      );
    };
  }

  /* ---------- DOMAIN NORMALIZER ---------- */
  function normalizeDomain(input) {
    try {
      input = input.trim();
      if (!input.startsWith("http")) input = "http://" + input;
      return new URL(input).hostname.replace(/^www\./, "");
    } catch {
      return input.split("/")[0].replace(/^www\./, "");
    }
  }

  /* ---------- RUN DETECTION ---------- */
  const runBtn = document.getElementById("run");
  const textarea = document.getElementById("domains");
  const tbody = document.getElementById("results");

  if (!runBtn || !textarea || !tbody) {
    console.error("Required elements missing");
    return;
  }

  runBtn.onclick = async () => {
    const domains = [...new Set(
      textarea.value
        .split(/\s+/)
        .map(normalizeDomain)
        .filter(Boolean)
    )];

    if (!domains.length) {
      alert("Please enter at least one domain.");
      return;
    }

    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="opacity:.6">Checking…</td>
      </tr>
    `;

    try {
      const res = await fetch("/.netlify/functions/detect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domains })
      });

      const data = await res.json();
      tbody.innerHTML = "";

      for (const r of data) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.domain}</td>
          <td>${r.cloudflare || "-"}</td>
          <td>${r.registrar || "-"}</td>
          <td>
            ${
              r.http_result && r.http_result !== "-"
                ? (() => {
                    const is301 = r.http_result.startsWith("301 to ");
                    const url = is301
                      ? r.http_result.replace("301 to ", "").trim()
                      : r.http_result;
          
                    return `
                      <a href="${url}"
                         target="_blank"
                         rel="noopener noreferrer"
                         title="Opens final destination URL"
                         style="color:var(--accent);text-decoration:underline">
                        ${r.http_result}
                      </a>
                    `;
                  })()
                : "-"
            }
          </td>

          <td>${r.http_via || "-"}</td>
          <td>${r.nameservers || "-"}</td>
        `;
        tbody.appendChild(tr);
      }
    } catch (err) {
      console.error(err);
      tbody.innerHTML = `
        <tr>
          <td colspan="6" style="color:red">
            Failed to run detection
          </td>
        </tr>
      `;
    }
  };
});
</script>


</body>
</html>
