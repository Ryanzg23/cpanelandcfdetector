<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
}

body.dark {
  --bg: #0f1220;
  --card: #171a2e;
  --text: #eaeaf0;
  --muted: #9ca3af;
  --border: #2a2f55;
  --accent: #4f7cff;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  transition: background .2s, color .2s;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--card);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}

textarea {
  width: 100%;
  min-height: 120px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
}

button {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border-bottom: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
  vertical-align: top;
}

th {
  color: var(--muted);
  text-align: left;
}

.theme-toggle {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.theme-toggle input {
  width: 40px;
  height: 20px;
}
</style>

</head>

<body>
<div class="theme-toggle">
  <span>🌞</span>
  <input type="checkbox" id="themeToggle">
  <span>🌙</span>
</div>
<div class="container">

<h1>Bulk Domain Detector</h1>

<div class="card">
  <b>Domains (one per line)</b>
  <textarea id="domains"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>


<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Registrar</th>
        <th>Cloudflare</th>
        <th>Nameservers</th>
      </tr>
    </thead>

    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
/* ---------- THEME TOGGLE ---------- */
const toggle = document.getElementById("themeToggle");
const savedTheme = localStorage.getItem("theme");

if (savedTheme === "dark") {
  document.body.classList.add("dark");
  toggle.checked = true;
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark", toggle.checked);
  localStorage.setItem("theme", toggle.checked ? "dark" : "light");
});

/* ---------- DOMAIN NORMALIZER ---------- */
function normalizeDomain(input) {
  try {
    input = input.trim();
    if (!input.startsWith("http")) input = "http://" + input;
    const url = new URL(input);
    return url.hostname.replace(/^www\./, "");
  } catch {
    return input.split("/")[0].replace(/^www\./, "");
  }
}

document.getElementById("run").onclick = async () => {
  const rawLines = document.getElementById("domains")
    .value.split(/\s+/)
    .filter(Boolean);

  const domains = [...new Set(
    rawLines.map(d => normalizeDomain(d)).filter(Boolean)
  )];

  const tbody = document.getElementById("results");
  tbody.innerHTML = "<tr><td colspan='4'>Checking…</td></tr>";

  const res = await fetch("/.netlify/functions/detect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ domains })
  });

  const data = await res.json();
  tbody.innerHTML = "";

  for (const r of data) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.domain}</td>
      <td>${r.registrar || "-"}</td>
      <td>
        ${
          r.cloudflare === "Not listed"
            ? `<span style="color:var(--muted)">Not listed</span>`
            : r.cloudflare && r.cloudflare !== "-"
              ? `<div style="font-size:14px;font-weight:600;color:#22c55e">
                   ${r.cloudflare}
                 </div>`
              : `<span style="opacity:.5">-</span>`
        }
      </td>
      <td>${r.nameservers || "-"}</td>
    `;
    tbody.appendChild(tr);
  }
};
</script>

</body>
</html>
